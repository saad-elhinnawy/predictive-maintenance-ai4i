[build]
builder = "NIXPACKS"

[deploy]
preDeployCommand = "cd backend && (npx prisma migrate resolve --rolled-back 20260610130000_add_customer_fields_to_order 2>/dev/null || true) && npx prisma migrate deploy"
startCommand = "node backend/dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
